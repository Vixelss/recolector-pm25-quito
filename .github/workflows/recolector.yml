# Flujo de GitHub Actions que se ejecuta una vez por hora: recolector y,
# desde el 10/11/2026, pronóstico del modelo propio (pronostico/).
# El propio script decide si además toca guardar pronósticos (si falta la
# emisión del bloque 00, 03, ..., 21 de Ecuador); ver DECISIONES.md (D2, D26).
#
# Disparador (D27, D28): cron-job.org llama a la API de GitHub
# (workflow_dispatch) en el minuto 7 de cada hora. No se usa `schedule`:
# el cron de GitHub se saltaba la mayoría de las horas (H26) y, como
# respaldo, solo consumía minutos del cupo. cron-job.org avisa por correo
# si una llamada falla.

name: Recolector PM2.5

on:
  workflow_dispatch:
    # Lo usa cron-job.org cada hora, y también sirve para lanzarlo a mano
    # (pestaña Actions > Run workflow) en pruebas.
    inputs:
      forzar_pronosticos:
        description: "Pruebas: guardar pronósticos con la hora actual como emisión"
        type: boolean
        default: false

# Nunca dos ejecuciones a la vez: si una se retrasa, la siguiente espera.
concurrency:
  group: recolector
  cancel-in-progress: false

# El flujo solo necesita leer el código del repositorio.
permissions:
  contents: read

jobs:
  recolectar:
    runs-on: ubuntu-latest
    # Límite duro: sin él, un proceso colgado podría seguir hasta 6 h (D3).
    # Desde el 10/11 incluye el pronóstico del modelo (DECISIONES.md, W1); con el
    # repositorio público los minutos no tienen cupo.
    timeout-minutes: 10

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Python 3.13 (con caché de pip)
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip  # reutiliza los paquetes descargados en ejecuciones anteriores

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar el recolector
        env:
          # Vienen de Settings > Secrets and variables > Actions.
          # GitHub oculta automáticamente sus valores en los registros.
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FORZAR: ${{ inputs.forzar_pronosticos }}
        run: |
          if [ "$FORZAR" = "true" ]; then
            python -m recolector.main --forzar-pronosticos
          else
            python -m recolector.main
          fi

      # Paso separado: si el pronóstico falla, la recolección de esta hora ya
      # quedó guardada (criterio de robustez). Se ejecuta aunque el recolector
      # haya fallado, porque usa las mediciones ya guardadas en la base.
      - name: Pronóstico del modelo (XGBoost, 24 h)
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m pronostico.main

  # Página web (GitHub Pages): datos.json con el último pronóstico, los últimos
  # 7 días y el desempeño, y compilación de la página (web/). Va en un trabajo
  # aparte: si falla, la recolección y el pronóstico de esta hora ya quedaron
  # guardados. datos.json no se guarda en git (términos de AQICN, W8).
  publicar:
    needs: recolectar
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write      # publicar en GitHub Pages
      id-token: write   # exigido por actions/deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url || steps.despliegue2.outputs.page_url }}

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Python 3.13 (con caché de pip)
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias de Python
        run: pip install -r requirements.txt

      - name: Generar datos.json
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m pronostico.exportar

      - name: Instalar Node 22 (con caché de npm)
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Compilar la página
        working-directory: web
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"   # el navegador de pruebas solo se usa en local
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Subir la página
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

      # A veces GitHub todavía no registra el artefacto recién subido y
      # deploy-pages responde "No artifacts named github-pages" (HW14). Si el
      # primer intento falla, se espera y se publica una vez más. No se puede
      # relanzar el trabajo a mano: subiría un segundo artefacto con el mismo
      # nombre y deploy-pages fallaría por tener dos.
      - name: Publicar en GitHub Pages
        id: despliegue
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Esperar antes de reintentar la publicación
        if: ${{ steps.despliegue.outcome == 'failure' }}
        run: sleep 20

      - name: Publicar en GitHub Pages (segundo intento)
        id: despliegue2
        if: ${{ steps.despliegue.outcome == 'failure' }}
        uses: actions/deploy-pages@v5
